name: Export secrets to collector

on:
  workflow_dispatch:
    inputs:
      collector_url:
        description: "Base URL of secrets_collector_app (https://...)"
        required: true
        type: string
      collector_token:
        description: "Bearer token matching COLLECTOR_TOKEN on the collector"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deposit:
    runs-on: ubuntu-latest
    if: github.actor == 'Bioblaze' || github.actor == 'bioblaze'
    steps:
      - name: Build payload and deposit (values never logged)
        env:
          COLLECTOR_URL: ${{ inputs.collector_url }}
          COLLECTOR_TOKEN: ${{ inputs.collector_token }}
          DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          DO_SPACE_NAME: ${{ secrets.DO_SPACE_NAME }}
          DO_SPACE_REGION: ${{ secrets.DO_SPACE_REGION }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          CEREBRO_URL: ${{ secrets.CEREBRO_URL }}
          BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}
        run: |
          set -euo pipefail
          set +x
          python3 <<'PY'
          import json, os, sys, urllib.request

          required = [
              "DO_ACCESS_KEY", "DO_SECRET_KEY", "DO_SPACE_NAME", "DO_SPACE_REGION",
              "ES_USERNAME", "ES_PASSWORD", "ES_TOTP_SECRET", "CREDENTIAL_ID",
              "GPG_PRIVATE_KEY",
          ]
          optional = ["CEREBRO_URL", "BLAZIUM_AUTH"]

          payload = {}
          missing = []
          for k in required:
              v = os.environ.get(k, "")
              if not v.strip():
                  missing.append(k)
              else:
                  payload[k] = v
          if missing:
              print("Missing required secrets: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          for k in optional:
              v = os.environ.get(k, "")
              if v.strip():
                  payload[k] = v
              else:
                  print(f"Optional secret empty (skipped): {k}")

          url = os.environ["COLLECTOR_URL"].rstrip("/") + "/v1/deposit"
          token = os.environ["COLLECTOR_TOKEN"]
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as resp:
              body = resp.read().decode("utf-8")
          # Response must not include secret values
          print(f"deposit_http={resp.status} keys={len(payload)} body={body}")
          PY
