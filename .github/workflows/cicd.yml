name: Build and Sign Commandline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: blazium-cli
            compiler: gcc
          - goos: windows
            goarch: amd64
            output: blazium-cli.exe
            compiler: x86_64-w64-mingw32-gcc
          - goos: darwin
            goarch: amd64
            output: blazium-cli
            compiler: o64-clang


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version to file
        run: |
          echo "${{ steps.version.outputs.simple_version }}" > data/cliBuild.txt

      - name: Get highest nightly version
        run: |
          set -euo pipefail
          response=$(curl -fsSL https://cdn.blazium.app/catalog/versions/nightly/latest.json)
          highest_version=$(echo "$response" | jq -r '.version' | tr -d '\n\r')
          if [ -z "$highest_version" ] || [ "$highest_version" = "null" ]; then
            response=$(curl -fsSL https://cdn.blazium.app/catalog/versions/nightly.json)
            highest_version=$(echo "$response" | jq -r 'max_by(.version | split(".") | map(tonumber)) | .version' | tr -d '\n\r')
          fi
          echo "$highest_version" > data/defaultEngineBuild.txt

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.2

      - name: Install dependencies for cross-compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm mingw-w64

      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Run application tests
        run: go test ./...

      - name: Build application
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CC=${{ matrix.compiler }} go build -o ./build/${{ matrix.output }} .

      - name: Compute sha256
        id: digest
        run: |
          SHA256=$(sha256sum build/${{ matrix.output }} | awk '{print $1}')
          SIZE=$(stat -c%s build/${{ matrix.output }})
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: GPG Signing build
        if: ${{ matrix.goos != 'windows' }}
        run: |
          gpg --batch --yes \
            --output build/${{ matrix.output }}.sig --detach-sign build/${{ matrix.output }}

      - name: GPG Signing build
        if: ${{ matrix.goos == 'windows' }}
        run: mkdir -p signed

      - uses: bioblaze/sslcom-code-signer@v5
        name: Windows Signing
        if: ${{ matrix.goos == 'windows' }}
        continue-on-error: true
        id: windows_sign
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/${{ matrix.output }}
          output_path: ./signed
          environment_name: PROD

      - name: Prepare Windows artifact
        if: ${{ matrix.goos == 'windows' }}
        id: windows_artifact
        run: |
          set -euo pipefail
          mkdir -p signed
          DEST="./signed/${{ matrix.output }}"

          if [ -f "$DEST" ]; then
            echo "Using signed Windows binary at $DEST"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif SIGNED="$(find ./signed -type f -name '${{ matrix.output }}' | head -n 1)" && [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$DEST"
            echo "Using signed Windows binary from $SIGNED"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Windows code signing failed; publishing unsigned build artifact." >&2
            cp "./build/${{ matrix.output }}" "$DEST"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          ls -la ./signed/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.goos }}
          path: |
            build/blazium-cli
            build/blazium-cli.sig
        if: ${{ matrix.goos != 'windows' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.goos == 'windows' }}
        with:
          name: signed-windows
          path: signed/blazium-cli.exe

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}
          out_dir: cli/${{ matrix.goos }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}
          out_dir: cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ matrix.goos != 'windows' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}.sig
          out_dir: cli/${{ matrix.goos }}

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ matrix.goos != 'windows' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}.sig
          out_dir: cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}

      - name: Updating Cerebro
        env:
          URL: https://cdn.blazium.app/cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}/${{ matrix.output }}
        run: |
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            SIG_URL="${URL}.sig"
            SIGNING="gpg"
          elif [[ "${{ steps.windows_artifact.outputs.signed }}" == "true" ]]; then
            SIG_URL=""
            SIGNING="sslcom"
          else
            SIG_URL=""
            SIGNING=""
          fi

          curl -s -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
          -H "Content-Type: application/json" \
          -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
          -d "$(cat <<EOF
          {
            "name": "Blazium CLI",
            "type": "cli",
            "version": "${{ steps.version.outputs.simple_version }}",
            "os": "${{ matrix.goos }}",
            "arch": "x86_64",
            "file": "$URL",
            "sig": "$SIG_URL",
            "sha256": "${{ steps.digest.outputs.sha256 }}",
            "size": ${{ steps.digest.outputs.size }},
            "signing": "$SIGNING",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"

  # Binaries are uploaded by the build matrix. Cerebro owns cli/cli.json after tool POSTs;
  # republish once all platforms have registered so the public manifest includes full history.
  publish-catalog:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Republish CLI catalog via Cerebro
        run: |
          set -euo pipefail
          curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/cdn/publish" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
            -d '{"scope":"cli"}'

