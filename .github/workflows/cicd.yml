name: Build and Sign Commandline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: blazium-cli
            compiler: gcc
          - goos: windows
            goarch: amd64
            output: blazium-cli.exe
            compiler: x86_64-w64-mingw32-gcc
          - goos: darwin
            goarch: amd64
            output: blazium-cli
            compiler: o64-clang


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version to file
        run: |
          echo "${{ steps.version.outputs.simple_version }}" > data/cliBuild.txt

      - name: Get highest nightly version
        run: |
          response=$(curl -s https://blazium.app/api/versions/data/nightly)
          highest_version=$(echo "$response" | jq -r 'max_by(.version | split(".") | map(tonumber)) | .version' | tr -d '\n\r')
          echo "$highest_version" > data/defaultEngineBuild.txt

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.2

      - name: Install dependencies for cross-compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm mingw-w64

      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Run application tests
        run: go test ./...

      - name: Build application
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CC=${{ matrix.compiler }} go build -o ./build/${{ matrix.output }} .

      - name: Compute sha256
        id: digest
        run: |
          SHA256=$(sha256sum build/${{ matrix.output }} | awk '{print $1}')
          SIZE=$(stat -c%s build/${{ matrix.output }})
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: GPG Signing build
        if: ${{ matrix.goos != 'windows' }}
        run: |
          gpg --batch --yes \
            --output build/${{ matrix.output }}.sig --detach-sign build/${{ matrix.output }}

      - name: GPG Signing build
        if: ${{ matrix.goos == 'windows' }}
        run: |
          mkdir signed

      - uses: bioblaze/sslcom-code-signer@v5
        name: Windows Signing
        if: ${{ matrix.goos == 'windows' }}
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/${{ matrix.output }}
          output_path: ./signed/${{ matrix.output }}
          environment_name: PROD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.goos }}
          path: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}
          out_dir: cli/${{ matrix.goos }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}
          out_dir: cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ matrix.goos != 'windows' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}.sig
          out_dir: cli/${{ matrix.goos }}

      - uses: BetaHuhn/do-spaces-action@v2
        if: ${{ matrix.goos != 'windows' }}
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: ${{ startsWith(matrix.goos, 'windows') && './signed' || './build' }}/${{ matrix.output }}.sig
          out_dir: cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}

      - name: Updating Cerebro
        env:
          URL: https://cdn.blazium.app/cli/${{ matrix.goos }}/${{ steps.version.outputs.simple_version }}/${{ matrix.output }}
        run: |
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            SIG_URL="${URL}.sig"
            SIGNING="gpg"
          else
            SIG_URL=""
            SIGNING="sslcom"
          fi

          curl -s -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
          -H "Content-Type: application/json" \
          -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
          -d "$(cat <<EOF
          {
            "name": "Blazium CLI",
            "type": "cli",
            "version": "${{ steps.version.outputs.simple_version }}",
            "os": "${{ matrix.goos }}",
            "arch": "x86_64",
            "file": "$URL",
            "sig": "$SIG_URL",
            "sha256": "${{ steps.digest.outputs.sha256 }}",
            "size": ${{ steps.digest.outputs.size }},
            "signing": "$SIGNING",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v4
        with:
          go-version: 1.23.2

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: signed-darwin
          path: artifacts/darwin

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows
          path: artifacts/windows

      - name: Normalize artifact layout
        run: |
          set -euo pipefail
          normalize_platform() {
            local platform="$1"
            local dir="artifacts/${platform}"
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          normalize_platform linux
          normalize_platform darwin
          normalize_platform windows
          ls -laR artifacts/

      - name: Download existing manifest
        continue-on-error: true
        run: curl -fsSL https://cdn.blazium.app/cli/cli.json -o existing-cli.json

      - name: Generate cli.json
        env:
          CEREBRO_MANIFEST: ${{ secrets.CEREBRO_URL }}/api/v1/tools/cli/manifest
        run: |
          ARGS=(--version "${{ steps.version.outputs.simple_version }}" --artifacts artifacts --out cli.json)
          if [ -f existing-cli.json ]; then
            ARGS+=(--base-manifest existing-cli.json)
          fi
          if [ -n "$CEREBRO_MANIFEST" ]; then
            ARGS+=(--cerebro-manifest "$CEREBRO_MANIFEST")
          fi
          go run ./cmd/generate-cli-manifest "${ARGS[@]}"

      - name: Verify cli.json checksums
        run: |
          chmod +x scripts/verify-cli-manifest.sh
          scripts/verify-cli-manifest.sh \
            --manifest cli.json \
            --version "${{ steps.version.outputs.simple_version }}" \
            --artifacts artifacts

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cli.json
          out_dir: cli

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cli.json
          out_dir: cli/${{ steps.version.outputs.simple_version }}

