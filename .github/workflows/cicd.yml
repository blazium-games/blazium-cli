name: Build and Sign Commandline

# Pull requests: test and cross-compile only (no signing, CDN, or release).
# Push to main/master and workflow_dispatch: sign, publish, and release.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Single version for the whole workflow so build/manifest/release cannot diverge
  # (e.g. a tag created mid-run must not change the version of later jobs).
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      simple_version: ${{ steps.finalize.outputs.simple_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version with Bioblaze/game-semver-action
        uses: Bioblaze/game-semver-action@v10
        id: version
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      # Public CLI line starts at 0.1.0. game-semver is pinned by tag v0.0.43, so
      # take max(computed, 0.1.0), bump past CDN latest, and skip versions whose
      # binaries are already on the CDN (a failed prior publish leaves objects
      # behind; Windows Authenticode hashes change on every sign).
      - name: Finalize version (0.1.0 baseline + CDN monotonic)
        id: finalize
        run: |
          set -euo pipefail
          COMPUTED="${{ steps.version.outputs.simple_version }}"
          CANDIDATE="$(go run ./cmd/finalize-cli-version --computed "$COMPUTED" --baseline 0.1.0)"
          echo "simple_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run application tests
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          go test ./...

  build:
    needs: [test, resolve-version]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            hub_arch: x86_64
            output: blazium-cli
            compiler: gcc
          - goos: linux
            goarch: 386
            hub_arch: x86_32
            output: blazium-cli
            compiler: gcc
          - goos: windows
            goarch: amd64
            hub_arch: x86_64
            output: blazium-cli.exe
            compiler: x86_64-w64-mingw32-gcc
          - goos: windows
            goarch: 386
            hub_arch: x86_32
            output: blazium-cli.exe
            compiler: i686-w64-mingw32-gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write version to file
        run: |
          echo "${{ needs.resolve-version.outputs.simple_version }}" > data/cliBuild.txt

      - name: Get highest nightly version
        run: |
          response=$(curl -s https://blazium.app/api/versions/data/nightly)
          highest_version=$(echo "$response" | jq -r 'max_by(.version | split(".") | map(tonumber)) | .version' | tr -d '\n\r')
          echo "$highest_version" > data/defaultEngineBuild.txt

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install dependencies for cross-compilation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64
          if [[ "${{ matrix.goarch }}" == "386" && "${{ matrix.goos }}" == "linux" ]]; then
            sudo apt-get install -y gcc-multilib g++-multilib
          fi

      - name: Build application
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CC=${{ matrix.compiler }}
          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.goarch }}" == "386" ]]; then
            export CGO_CFLAGS="-m32"
            export CGO_LDFLAGS="-m32"
          fi
          go build -o ./build/${{ matrix.output }} .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: build/${{ matrix.output }}

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Require every build artifact
        run: |
          set -euo pipefail
          find_bin() {
            local dir="$1" name="$2"
            if [ -f "${dir}/${name}" ]; then
              return 0
            fi
            if [ -f "${dir}/build/${name}" ]; then
              return 0
            fi
            echo "missing ${dir}/${name}" >&2
            return 1
          }
          find_bin artifacts/linux/x86_64 blazium-cli
          find_bin artifacts/linux/x86_32 blazium-cli
          find_bin artifacts/windows/x86_64 blazium-cli.exe
          find_bin artifacts/windows/x86_32 blazium-cli.exe

  # Signing runs only after every arch artifact exists, and only off pull requests.
  sign:
    needs: [resolve-version, validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            hub_arch: x86_64
            output: blazium-cli
          - goos: linux
            hub_arch: x86_32
            output: blazium-cli
          - goos: windows
            hub_arch: x86_64
            output: blazium-cli.exe
          - goos: windows
            hub_arch: x86_32
            output: blazium-cli.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: build

      - name: Install GPG
        if: ${{ matrix.goos != 'windows' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Import GPG key
        if: ${{ matrix.goos != 'windows' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: GPG Signing build
        if: ${{ matrix.goos != 'windows' }}
        run: |
          gpg --batch --yes \
            --output build/${{ matrix.output }}.sig --detach-sign build/${{ matrix.output }}

      - name: Prepare signed dir (Windows)
        if: ${{ matrix.goos == 'windows' }}
        run: mkdir -p signed

      - uses: bioblaze/sslcom-code-signer@v6
        name: Windows Signing
        if: ${{ matrix.goos == 'windows' }}
        continue-on-error: true
        id: windows_sign
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ./build/${{ matrix.output }}
          output_path: ./signed
          environment_name: PROD

      - name: Prepare Windows artifact
        if: ${{ matrix.goos == 'windows' }}
        id: windows_artifact
        run: |
          set -euo pipefail
          mkdir -p signed
          DEST="./signed/${{ matrix.output }}"

          if [ -f "$DEST" ]; then
            echo "Using signed Windows binary at $DEST"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif SIGNED="$(find ./signed -type f -name '${{ matrix.output }}' | head -n 1)" && [ -n "$SIGNED" ]; then
            cp "$SIGNED" "$DEST"
            echo "Using signed Windows binary from $SIGNED"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Windows code signing failed; publishing unsigned build artifact." >&2
            cp "./build/${{ matrix.output }}" "$DEST"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          ls -la ./signed/

      - name: Record Windows signing
        if: ${{ matrix.goos == 'windows' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.windows_artifact.outputs.signed }}" == "true" ]]; then
            echo sslcom > signed/signing.txt
          else
            echo unsigned > signed/signing.txt
          fi

      - name: Upload artifacts (unix)
        uses: actions/upload-artifact@v4
        if: ${{ matrix.goos != 'windows' }}
        with:
          name: signed-${{ matrix.goos }}-${{ matrix.hub_arch }}
          path: |
            build/blazium-cli
            build/blazium-cli.sig

      - name: Upload artifacts (windows)
        uses: actions/upload-artifact@v4
        if: ${{ matrix.goos == 'windows' }}
        with:
          name: signed-windows-${{ matrix.hub_arch }}
          path: |
            signed/blazium-cli.exe
            signed/signing.txt

  manifest:
    needs: [resolve-version, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Normalize artifact layout
        run: |
          set -euo pipefail
          normalize_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          for d in artifacts/linux/x86_64 artifacts/linux/x86_32 artifacts/windows/x86_64 artifacts/windows/x86_32; do
            normalize_dir "$d"
          done
          ls -laR artifacts/

      - name: Require every signed artifact
        run: |
          set -euo pipefail
          test -f artifacts/linux/x86_64/blazium-cli
          test -f artifacts/linux/x86_64/blazium-cli.sig
          test -f artifacts/linux/x86_32/blazium-cli
          test -f artifacts/linux/x86_32/blazium-cli.sig
          test -f artifacts/windows/x86_64/blazium-cli.exe
          test -f artifacts/windows/x86_32/blazium-cli.exe

      - name: Download existing manifest
        continue-on-error: true
        run: curl -fsSL https://cdn.blazium.app/cli/cli.json -o existing-cli.json

      - name: Generate cli.json
        env:
          CEREBRO_MANIFEST: ${{ secrets.CEREBRO_URL }}/api/v1/tools/cli/manifest
        run: |
          ARGS=(--version "${{ needs.resolve-version.outputs.simple_version }}" --artifacts artifacts --out cli.json)
          if [ -f existing-cli.json ]; then
            ARGS+=(--base-manifest existing-cli.json)
          fi
          if [ -n "$CEREBRO_MANIFEST" ]; then
            ARGS+=(--cerebro-manifest "$CEREBRO_MANIFEST")
          fi
          go run ./cmd/generate-cli-manifest "${ARGS[@]}"

      # Write versioned objects from the same files hashed into cli.json.
      # Doing this here (not in publish) avoids Windows signed-artifact drift.
      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-cli
          out_dir: cli/linux/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-cli.sig
          out_dir: cli/linux/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-cli
          out_dir: cli/linux/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-cli.sig
          out_dir: cli/linux/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_64/blazium-cli.exe
          out_dir: cli/windows/x86_64/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_32/blazium-cli.exe
          out_dir: cli/windows/x86_32/${{ needs.resolve-version.outputs.simple_version }}

      - name: Verify cli.json checksums
        run: |
          chmod +x scripts/verify-cli-manifest.sh
          scripts/verify-cli-manifest.sh \
            --manifest cli.json \
            --version "${{ needs.resolve-version.outputs.simple_version }}" \
            --artifacts artifacts

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cli.json
          out_dir: cli

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: cli.json
          out_dir: cli/${{ needs.resolve-version.outputs.simple_version }}

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-cli
          out_dir: cli/linux/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_64/blazium-cli.sig
          out_dir: cli/linux/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-cli
          out_dir: cli/linux/x86_32

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/linux/x86_32/blazium-cli.sig
          out_dir: cli/linux/x86_32

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_64/blazium-cli.exe
          out_dir: cli/windows/x86_64

      - uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.DO_ACCESS_KEY }}
          secret_key: ${{ secrets.DO_SECRET_KEY }}
          space_name: ${{ secrets.DO_SPACE_NAME }}
          space_region: ${{ secrets.DO_SPACE_REGION }}
          source: artifacts/windows/x86_32/blazium-cli.exe
          out_dir: cli/windows/x86_32

      - name: Register with Cerebro
        env:
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          register() {
            local os="$1" arch="$2" file="$3" signing="$4"
            local url="https://cdn.blazium.app/cli/${os}/${arch}/${VERSION}/$(basename "$file")"
            local sig=""
            if [[ "$signing" == "gpg" ]]; then
              sig="${url}.sig"
            elif [[ "$signing" == "unsigned" ]]; then
              signing=""
            fi
            local sha size
            sha=$(sha256sum "$file" | awk '{print $1}')
            size=$(stat -c%s "$file")
            curl -fsS -X POST "${{ secrets.CEREBRO_URL }}/api/v1/tools" \
              -H "Content-Type: application/json" \
              -H "BLAZIUM_AUTH: ${{ secrets.BLAZIUM_AUTH }}" \
              -d "$(cat <<EOF
          {
            "name": "Blazium CLI",
            "type": "cli",
            "version": "${VERSION}",
            "os": "${os}",
            "arch": "${arch}",
            "file": "${url}",
            "sig": "${sig}",
            "sha256": "${sha}",
            "size": ${size},
            "signing": "${signing}",
            "released_on": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          )"
          }
          win_signing() {
            local arch="$1"
            local marker="artifacts/windows/${arch}/signing.txt"
            if [[ -f "$marker" && "$(tr -d '[:space:]' < "$marker")" == "sslcom" ]]; then
              echo sslcom
            else
              echo unsigned
            fi
          }
          register linux x86_64 artifacts/linux/x86_64/blazium-cli gpg
          register linux x86_32 artifacts/linux/x86_32/blazium-cli gpg
          register windows x86_64 artifacts/windows/x86_64/blazium-cli.exe "$(win_signing x86_64)"
          register windows x86_32 artifacts/windows/x86_32/blazium-cli.exe "$(win_signing x86_32)"

  github-release:
    needs: [resolve-version, manifest]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          set -euo pipefail
          V="${{ needs.resolve-version.outputs.simple_version }}"
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_64
          path: artifacts/linux/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-linux-x86_32
          path: artifacts/linux/x86_32

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_64
          path: artifacts/windows/x86_64

      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-x86_32
          path: artifacts/windows/x86_32

      - name: Normalize and stage release assets
        run: |
          set -euo pipefail
          normalize_dir() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            if [ -d "${dir}/build" ]; then
              mv "${dir}/build/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/build" 2>/dev/null || true
            fi
            if [ -d "${dir}/signed" ]; then
              mv "${dir}/signed/"* "${dir}/" 2>/dev/null || true
              rmdir "${dir}/signed" 2>/dev/null || true
            fi
          }
          for d in artifacts/linux/x86_64 artifacts/linux/x86_32 artifacts/windows/x86_64 artifacts/windows/x86_32; do
            normalize_dir "$d"
          done
          mkdir -p release-assets
          stage() {
            local src="$1"
            local dest="$2"
            if [ -f "$src" ]; then
              cp "$src" "release-assets/${dest}"
            fi
          }
          stage artifacts/linux/x86_64/blazium-cli blazium-cli-linux-x86_64
          stage artifacts/linux/x86_64/blazium-cli.sig blazium-cli-linux-x86_64.sig
          stage artifacts/linux/x86_32/blazium-cli blazium-cli-linux-x86_32
          stage artifacts/linux/x86_32/blazium-cli.sig blazium-cli-linux-x86_32.sig
          stage artifacts/windows/x86_64/blazium-cli.exe blazium-cli-windows-x86_64.exe
          stage artifacts/windows/x86_32/blazium-cli.exe blazium-cli-windows-x86_32.exe
          test -f release-assets/blazium-cli-linux-x86_64
          test -f release-assets/blazium-cli-linux-x86_64.sig
          test -f release-assets/blazium-cli-linux-x86_32
          test -f release-assets/blazium-cli-linux-x86_32.sig
          test -f release-assets/blazium-cli-windows-x86_64.exe
          test -f release-assets/blazium-cli-windows-x86_32.exe
          ls -la release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-assets -type f | sort)
          test "${#FILES[@]}" -ge 2
          NOTES="Blazium CLI ${VER}

          Install editors, manage projects, self-update, and remote-control a running Blazium editor.

          | Platform | Arch | Asset |
          |----------|------|--------|
          | Linux | x86_64 | \`blazium-cli-linux-x86_64\` |
          | Linux | x86_32 | \`blazium-cli-linux-x86_32\` |
          | Windows | x86_64 | \`blazium-cli-windows-x86_64.exe\` |
          | Windows | x86_32 | \`blazium-cli-windows-x86_32.exe\` |

          CDN:
          - Manifest: https://cdn.blazium.app/cli/cli.json
          - Binaries: https://cdn.blazium.app/cli/{os}/{arch}/${VER}/

          Upgrade in place:
          \`\`\`
          blazium-cli upgrade
          blazium-cli update apply --product cli
          \`\`\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Blazium CLI ${VER}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
          gh release view "$TAG"
